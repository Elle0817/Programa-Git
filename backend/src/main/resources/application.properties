spring.application.name=backend-api

spring.datasource.url=jdbc:mysql://localhost:3306/mi_guia_turistico_v2
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=8080

# CORS centralizado para los dos orígenes locales del frontend.
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Accept,Origin

# ID opcional del negocio activo. Si se omite, se selecciona solo cuando hay un único negocio activo.
mi-guia.negocio-activo-id=${NEGOCIO_ACTIVO_ID:}
